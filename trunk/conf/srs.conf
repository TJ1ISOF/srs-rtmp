listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

vhost __defaultVhost__ {
    enabled         on;

    chunk_size      4096;

    stream {
        enabled     on;
    }

    http_api {
        enabled     on;
        listen      1985;
    }

    http_server {
        enabled     on;
        listen      8080;
        dir         ./objs/nginx/html;
    }

    tcp_nodelay     on;
}
